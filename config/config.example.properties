# Copy this file to config/config.properties and edit it.
# config/config.properties is listed in .gitignore - never commit real passwords or API keys.

# ---- MySQL connection ----
db.url=jdbc:mysql://localhost:3306/urbanvibe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=123456

# ---- Optional: OpenWeatherMap API key (weather for outdoor events) ----
# Free key: https://openweathermap.org/api  ->  sign up  ->  My API keys
# You can also set the environment variable URBANVIBE_WEATHER_KEY instead.
weather.api.key=YOUR_OPENWEATHERMAP_KEY

# ---- Optional: chance (0.0 - 1.0) that a simulated payment randomly fails ----
payment.failure.rate=0.0
